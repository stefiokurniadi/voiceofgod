services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: voiceofgod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: voiceofgod
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceofgod -d voiceofgod"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  translator:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.31.0}
    profiles: ["gpu"]
    ipc: host
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      --max-model-len 4096
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.70}
    environment:
      HF_HOME: /models
    volumes:
      - model-cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  mediamtx:
    image: bluenviron/mediamtx:1.13.1
    restart: unless-stopped
    command: ["/mediamtx.yml"]
    environment:
      RTMP_AUTH_URL: http://api:8080/internal/rtmp-auth/${RTMP_AUTH_SECRET:-disabled}
    ports:
      - "1935:1935"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mediamtx:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://voiceofgod:${POSTGRES_PASSWORD}@postgres:5432/voiceofgod
      REDIS_URL: redis://valkey:6379/0
      VLLM_BASE_URL: http://translator:8000/v1
      MEDIAMTX_RTMP_URL: rtmp://mediamtx:1935
      MODEL_DIR: /models
      VOICEOFGOD_ROOT: /opt/voiceofgod
    ports:
      - "8080:8080"
    volumes:
      - model-cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model-cache:
  postgres-data:
