<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Operator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="operator">
  <div class="operator-grid">
    <aside class="side">
      <h1 style="font-size:1.6rem">Operator</h1>
      <p class="banner" id="banner"></p>
      <p id="metrics"></p>
      <div class="controls">
        <button class="primary" id="start" type="button">Start</button>
        <button id="stop" type="button">End</button>
      </div>
      <label>Speaker language
        <select id="language">
          <option value="en">English</option>
          <option value="id">Bahasa Indonesia</option>
        </select>
      </label>
      <p><a id="listener-link" href="">Listener link</a></p>
      <div class="links">
        <a id="overlay-link" href="" target="_blank">Overlay</a>
        <a id="download-txt" href="">TXT</a>
        <a id="download-srt" href="">SRT</a>
      </div>
      <img id="qr" alt="QR code for the listener page">
      <details>
        <summary>Glossary</summary>
        <div id="glossary-rows"></div>
        <label>Do not translate
          <textarea id="glossary-dnt" rows="3"></textarea>
        </label>
        <div class="controls">
          <button type="button" id="glossary-add">Add term</button>
          <button type="button" id="glossary-save">Save glossary</button>
        </div>
      </details>
      <p class="error" id="error"></p>
    </aside>
    <div class="columns">
      <section>
        <h2>Original</h2>
        <main class="captions" id="original" data-size="2"></main>
      </section>
      <section>
        <h2>Translation</h2>
        <main class="captions" id="translation" data-size="2"></main>
      </section>
    </div>
  </div>
  <script src="/static/captions.js"></script>
  <script>
    const sessionId = location.pathname.split("/").filter(Boolean).pop();
    const token = new URLSearchParams(location.search).get("k") || "";
    const banner = document.querySelector("#banner");
    const metrics = document.querySelector("#metrics");
    const error = document.querySelector("#error");
    const headers = { "X-Operator-Token": token, "content-type": "application/json" };
    let socket = null;
    let audioContext = null;
    let stream = null;
    let snapshot = { lines: [] };
    let lastLineId = "";
    let lastSeq = 0;
    let reconnectTimer = null;
    let stopped = false;
    let glossaryFilled = false;

    function fieldOriginal() { return "full_original"; }
    function fieldTranslation() { return "full_translation"; }
    const originalView = CaptionView(document.querySelector("#original"), {
      fieldOf: () => "full_original",
      decorate: decorate
    });
    const translationView = CaptionView(document.querySelector("#translation"), {
      fieldOf: () => "full_translation"
    });

    function decorate(node, line) {
      let tools = node.querySelector(".line-tools");
      if (line.state !== "final") {
        if (tools) tools.remove();
        return;
      }
      if (!tools) {
        tools = document.createElement("span");
        tools.className = "line-tools";
        const hide = document.createElement("button");
        hide.type = "button";
        hide.textContent = "Hide";
        hide.addEventListener("click", () => act(line.id, "hide"));
        tools.appendChild(hide);
        node.appendChild(tools);
      }
      let restore = tools.querySelector("[data-restore]");
      if (line.suppressed && !restore) {
        restore = document.createElement("button");
        restore.type = "button";
        restore.dataset.restore = "1";
        restore.textContent = "Restore";
        restore.addEventListener("click", () => act(line.id, "restore"));
        tools.appendChild(restore);
      }
      if (!line.suppressed && restore) restore.remove();
    }

    async function act(lineId, action) {
      await fetch(`/api/sessions/${sessionId}/lines/${lineId}/${action}`, { method: "POST", headers });
    }

    function remember(event) {
      if (event.seq) lastSeq = Math.max(lastSeq, event.seq);
      for (const line of event.lines || []) {
        if (line.state === "final") lastLineId = line.id;
      }
      if (event.line && event.line.state === "final") lastLineId = event.line.id;
    }

    function showMetrics(source) {
      const lag = source && source.lag_ms;
      const listeners = source && source.listeners;
      const stt = source && source.stt_ms;
      const translate = source && source.translate_ms;
      const gpu = source && source.gpu;
      const parts = [`Listeners ${listeners || 0}`];
      if (lag != null) parts.push(`lag ${Math.round(lag)} ms`);
      if (stt != null) parts.push(`speech ${Math.round(stt)} ms`);
      if (translate != null) parts.push(`translate ${Math.round(translate)} ms`);
      if (gpu) parts.push(`GPU ${Math.round(gpu.utilization_percent)}%`);
      else if (source && Object.prototype.hasOwnProperty.call(source, "gpu")) parts.push("GPU unavailable");
      metrics.textContent = parts.join(" · ");
    }

    function glossaryRow(english, indonesian, aliases) {
      const row = document.createElement("div");
      row.className = "glossary-row";
      row.dataset.aliases = JSON.stringify(aliases || []);
      const en = document.createElement("input");
      en.placeholder = "English";
      en.value = english || "";
      const id = document.createElement("input");
      id.placeholder = "Bahasa Indonesia";
      id.value = indonesian || "";
      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "Remove";
      remove.addEventListener("click", () => row.remove());
      row.append(en, id, remove);
      return row;
    }

    function fillGlossary(glossary) {
      if (glossaryFilled || !glossary) return;
      glossaryFilled = true;
      const rows = document.querySelector("#glossary-rows");
      rows.replaceChildren();
      for (const term of glossary.terms || []) rows.append(glossaryRow(term.en, term.id, term.id_aliases));
      if (!(glossary.terms || []).length) rows.append(glossaryRow("", ""));
      document.querySelector("#glossary-dnt").value = (glossary.do_not_translate || []).join("\n");
    }

    function paint(next, mode) {
      snapshot = next;
      remember(next);
      banner.textContent = next.banner || next.status || "";
      showMetrics(next.metrics);
      document.querySelector("#language").value = next.speaker_language || "en";
      fillGlossary(next.glossary);
      const rendered = withOperatorText(next);
      if (mode === "resume") {
        originalView.applyResume(rendered.lines, rendered.provisional);
        translationView.applyResume(rendered.lines, rendered.provisional);
      } else {
        originalView.applySnapshot(rendered);
        translationView.applySnapshot(rendered);
      }
    }

    function withOperatorText(next) {
      const copy = {
        ...next,
        lines: (next.lines || []).map(operatorLine),
        provisional: next.provisional ? operatorLine(next.provisional) : null
      };
      return copy;
    }

    function operatorLine(line) {
      return {
        ...line,
        full_original: line.full_original || line.original || "",
        full_translation: line.full_translation || line.translation || ""
      };
    }

    async function load() {
      const response = await fetch(`/api/sessions/${sessionId}`, { headers });
      if (!response.ok) {
        error.textContent = "This operator link is not valid.";
        return;
      }
      paint(await response.json());
    }

    function connect() {
      const query = new URLSearchParams({ k: token });
      if (lastLineId) query.set("after", lastLineId);
      if (lastSeq) query.set("since", String(lastSeq));
      socket = new WebSocket(`${location.origin.replace(/^http/, "ws")}/ws/operate/${sessionId}?${query}`);
      socket.onopen = () => { if (error.textContent === "Reconnecting…") error.textContent = ""; };
      socket.onmessage = (message) => {
        const event = JSON.parse(message.data);
        remember(event);
        if (event.type === "deleted") { stopped = true; socket.close(); return; }
        if (event.status === "ended") stopped = true;
        if (event.type === "snapshot") { paint(event); return; }
        if (event.type === "resume") { paint(event, "resume"); return; }
        if (event.metrics) showMetrics(event.metrics);
        banner.textContent = event.banner || event.status || "";
        const line = event.line ? operatorLine(event.line) : null;
        const provisional = event.provisional ? operatorLine(event.provisional) : null;
        originalView.applyEvent({ ...event, line, provisional });
        translationView.applyEvent({ ...event, line, provisional });
      };
      socket.onclose = () => {
        if (stopped || reconnectTimer) return;
        error.textContent = "Reconnecting…";
        reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, 1000);
      };
    }

    async function startMic() {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      audioContext = new AudioContext();
      await audioContext.audioWorklet.addModule("/static/worklet.js");
      const source = audioContext.createMediaStreamSource(stream);
      const node = new AudioWorkletNode(audioContext, "pcm-capture");
      node.port.onmessage = (event) => {
        if (socket && socket.readyState === WebSocket.OPEN) socket.send(event.data);
      };
      source.connect(node);
      if (audioContext.state !== "running") await audioContext.resume();
    }

    document.querySelector("#start").addEventListener("click", async () => {
      error.textContent = "";
      const response = await fetch(`/api/sessions/${sessionId}/start`, { method: "POST", headers });
      const body = await response.json();
      if (!response.ok) {
        error.textContent = body.detail || "Could not start.";
        return;
      }
      try {
        await startMic();
      } catch (err) {
        error.textContent = "Microphone permission was denied.";
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: "capture", state: "denied" }));
        }
      }
    });
    document.querySelector("#stop").addEventListener("click", async () => {
      stopped = true;
      await fetch(`/api/sessions/${sessionId}/stop`, { method: "POST", headers });
      if (stream) stream.getTracks().forEach((track) => track.stop());
    });
    document.querySelector("#language").addEventListener("change", async (event) => {
      await fetch(`/api/sessions/${sessionId}/language`, {
        method: "POST",
        headers,
        body: JSON.stringify({ speaker_language: event.target.value })
      });
    });

    const listenerUrl = `${location.origin}/l/${sessionId}`;
    document.querySelector("#listener-link").href = listenerUrl;
    document.querySelector("#overlay-link").href = `${location.origin}/v/${sessionId}`;
    document.querySelector("#download-txt").href = `/api/sessions/${sessionId}/export.txt?k=${encodeURIComponent(token)}`;
    document.querySelector("#download-srt").href = `/api/sessions/${sessionId}/export.srt?k=${encodeURIComponent(token)}`;
    document.querySelector("#qr").src = `/api/sessions/${sessionId}/qr.svg?k=${encodeURIComponent(token)}`;
    document.querySelector("#glossary-add").addEventListener("click", () => {
      document.querySelector("#glossary-rows").append(glossaryRow("", ""));
    });
    document.querySelector("#glossary-save").addEventListener("click", async () => {
      const terms = [...document.querySelectorAll("#glossary-rows .glossary-row")].map((row) => {
        const [en, id] = row.querySelectorAll("input");
        return { en: en.value.trim(), id: id.value.trim(), id_aliases: JSON.parse(row.dataset.aliases || "[]") };
      }).filter((term) => term.en || term.id);
      const doNotTranslate = document.querySelector("#glossary-dnt").value.split("\n").map((line) => line.trim()).filter(Boolean);
      const response = await fetch(`/api/sessions/${sessionId}/glossary`, {
        method: "PUT",
        headers,
        body: JSON.stringify({ terms, do_not_translate: doNotTranslate })
      });
      const body = await response.json();
      error.textContent = response.ok ? "" : (body.detail || "Could not save the glossary.");
    });
    setInterval(async () => {
      const response = await fetch(`/api/sessions/${sessionId}/metrics`, { headers });
      if (response.ok) showMetrics(await response.json());
    }, 5000);
    load().then(connect);
  </script>
</body>
</html>
