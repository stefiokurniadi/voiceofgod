<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Operator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="operator">
  <div class="operator-grid">
    <aside class="side">
      <h1 style="font-size:1.6rem">Operator</h1>
      <p class="banner" id="banner"></p>
      <p id="metrics"></p>
      <div class="controls">
        <button class="primary" id="start" type="button">Start</button>
        <button id="stop" type="button">End</button>
      </div>
      <label>Speaker language
        <select id="language">
          <option value="en">English</option>
          <option value="id">Bahasa Indonesia</option>
        </select>
      </label>
      <p><a id="listener-link" href="">Listener link</a></p>
      <img id="qr" alt="QR code for the listener page">
      <p class="error" id="error"></p>
    </aside>
    <div class="columns">
      <section>
        <h2>Original</h2>
        <main class="captions" id="original" data-size="2"></main>
      </section>
      <section>
        <h2>Translation</h2>
        <main class="captions" id="translation" data-size="2"></main>
      </section>
    </div>
  </div>
  <script src="/static/captions.js"></script>
  <script>
    const sessionId = location.pathname.split("/").filter(Boolean).pop();
    const token = new URLSearchParams(location.search).get("k") || "";
    const banner = document.querySelector("#banner");
    const metrics = document.querySelector("#metrics");
    const error = document.querySelector("#error");
    const headers = { "X-Operator-Token": token, "content-type": "application/json" };
    let socket = null;
    let audioContext = null;
    let stream = null;
    let snapshot = { lines: [] };

    function fieldOriginal() { return "full_original"; }
    function fieldTranslation() { return "full_translation"; }
    const originalView = CaptionView(document.querySelector("#original"), {
      fieldOf: () => "full_original",
      decorate: decorate
    });
    const translationView = CaptionView(document.querySelector("#translation"), {
      fieldOf: () => "full_translation"
    });

    function decorate(node, line) {
      let tools = node.querySelector(".line-tools");
      if (line.state !== "final") {
        if (tools) tools.remove();
        return;
      }
      if (!tools) {
        tools = document.createElement("span");
        tools.className = "line-tools";
        const hide = document.createElement("button");
        hide.type = "button";
        hide.textContent = "Hide";
        hide.addEventListener("click", () => act(line.id, "hide"));
        tools.appendChild(hide);
        node.appendChild(tools);
      }
      let restore = tools.querySelector("[data-restore]");
      if (line.suppressed && !restore) {
        restore = document.createElement("button");
        restore.type = "button";
        restore.dataset.restore = "1";
        restore.textContent = "Restore";
        restore.addEventListener("click", () => act(line.id, "restore"));
        tools.appendChild(restore);
      }
      if (!line.suppressed && restore) restore.remove();
    }

    async function act(lineId, action) {
      await fetch(`/api/sessions/${sessionId}/lines/${lineId}/${action}`, { method: "POST", headers });
    }

    function paint(next) {
      snapshot = next;
      banner.textContent = next.banner || next.status || "";
      const lag = next.metrics && next.metrics.lag_ms;
      const listeners = next.metrics && next.metrics.listeners;
      metrics.textContent = `Listeners ${listeners || 0}` + (lag != null ? ` · last caption ${Math.round(lag)} ms` : "");
      document.querySelector("#language").value = next.speaker_language || "en";
      originalView.applySnapshot(withOperatorText(next));
      translationView.applySnapshot(withOperatorText(next));
    }

    function withOperatorText(next) {
      const copy = {
        ...next,
        lines: (next.lines || []).map(operatorLine),
        provisional: next.provisional ? operatorLine(next.provisional) : null
      };
      return copy;
    }

    function operatorLine(line) {
      return {
        ...line,
        full_original: line.full_original || line.original || "",
        full_translation: line.full_translation || line.translation || ""
      };
    }

    async function load() {
      const response = await fetch(`/api/sessions/${sessionId}`, { headers });
      if (!response.ok) {
        error.textContent = "This operator link is not valid.";
        return;
      }
      paint(await response.json());
    }

    function connect() {
      socket = new WebSocket(`${location.origin.replace(/^http/, "ws")}/ws/operate/${sessionId}?k=${encodeURIComponent(token)}`);
      socket.onmessage = (message) => {
        const event = JSON.parse(message.data);
        if (event.type === "snapshot") {
          paint(event);
          return;
        }
        if (event.metrics) {
          metrics.textContent = `Listeners ${event.metrics.listeners || 0}` + (event.metrics.lag_ms != null ? ` · last caption ${Math.round(event.metrics.lag_ms)} ms` : "");
        }
        banner.textContent = event.banner || event.status || "";
        const line = event.line ? operatorLine(event.line) : null;
        const provisional = event.provisional ? operatorLine(event.provisional) : null;
        originalView.applyEvent({ ...event, line, provisional });
        translationView.applyEvent({ ...event, line, provisional });
      };
      socket.onclose = () => setTimeout(connect, 1000);
    }

    async function startMic() {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      audioContext = new AudioContext();
      await audioContext.audioWorklet.addModule("/static/worklet.js");
      const source = audioContext.createMediaStreamSource(stream);
      const node = new AudioWorkletNode(audioContext, "pcm-capture");
      node.port.onmessage = (event) => {
        if (socket && socket.readyState === WebSocket.OPEN) socket.send(event.data);
      };
      source.connect(node);
      if (audioContext.state !== "running") await audioContext.resume();
    }

    document.querySelector("#start").addEventListener("click", async () => {
      error.textContent = "";
      const response = await fetch(`/api/sessions/${sessionId}/start`, { method: "POST", headers });
      const body = await response.json();
      if (!response.ok) {
        error.textContent = body.detail || "Could not start.";
        return;
      }
      try {
        await startMic();
      } catch (err) {
        error.textContent = "Microphone permission was denied.";
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: "capture", state: "denied" }));
        }
      }
    });
    document.querySelector("#stop").addEventListener("click", async () => {
      await fetch(`/api/sessions/${sessionId}/stop`, { method: "POST", headers });
      if (stream) stream.getTracks().forEach((track) => track.stop());
    });
    document.querySelector("#language").addEventListener("change", async (event) => {
      await fetch(`/api/sessions/${sessionId}/language`, {
        method: "POST",
        headers,
        body: JSON.stringify({ speaker_language: event.target.value })
      });
    });

    const listenerUrl = `${location.origin}/l/${sessionId}`;
    document.querySelector("#listener-link").href = listenerUrl;
    document.querySelector("#qr").src = `/api/sessions/${sessionId}/qr.svg?k=${encodeURIComponent(token)}`;
    load().then(connect);
  </script>
</body>
</html>
