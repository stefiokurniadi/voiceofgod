[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceofgod"
version = "0.1.0"
description = "Self-hosted live sermon captions between English and Bahasa Indonesia."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "numpy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "redis>=5.2",
    "segno>=1.6",
    "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
